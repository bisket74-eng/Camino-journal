</style>

<script>
/* =====================================================================
   ITINERARY v3 — Dates / Times / Details reading levels
   ===================================================================== */
(function () {

  const ICONS = {
    "Airline Reservation": "✈️",
    "Train Reservation": "🚆",
    "Hotel Reservation": "🏨",
    "Albergue Reservation": "🛏️",
    "Bus Reservation": "🚌",
    "Taxi / Rideshare": "🚕",
    "Ferry": "⛴️",
    "Screenshot Only": "📷",
    "Other": "📌"
  };

  const ACTIONS = {
    "Airline Reservation": "Flight",
    "Train Reservation": "Train",
    "Bus Reservation": "Bus",
    "Taxi / Rideshare": "Ride",
    "Ferry": "Ferry",
    "Screenshot Only": "Plan",
    "Other": "Plan"
  };

  const STAYS = ["Hotel Reservation", "Albergue Reservation"];

  // 1 = dates only, 2 = dates + times, 3 = everything
  let itnLevel = 2;
  try {
    const saved = Number(localStorage.getItem("caminoItnLevel"));
    if (saved >= 1 && saved <= 3) itnLevel = saved;
  } catch (e) {}

  function t(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    let h = d.getHours();
    const m = String(d.getMinutes()).padStart(2, "0");
    const ap = h < 12 ? "a" : "p";
    h = h % 12 || 12;
    return h + ":" + m + ap;
  }

  function dayKey(iso) {
    return String(iso || "").slice(0, 10);
  }

  function build() {
    const list = [];

    (typeof travel !== "undefined" ? travel : []).forEach((leg, order) => {
      const icon = ICONS[leg.type] || "📌";
      const name = leg.title || leg.carrier || leg.type || "Reservation";
      const route = leg.from && leg.to ? leg.from + " → " + leg.to
                  : (leg.from || leg.to || "");
      const ref = [leg.carrier, leg.number].filter(Boolean).join(" · ");
      const thumb = (leg.photos || [])[0] ? leg.photos[0].src : null;

      if (STAYS.includes(leg.type)) {
        list.push({
          when: leg.departure || "", order, icon,
          action: "Check in", name, route, ref,
          endWhen: "", notes: leg.notes || "", paid: !!leg.paid, thumb
        });

        if (leg.arrival) {
          list.push({
            when: leg.arrival, order, icon: "🧳",
            action: "Check out", name, route: leg.from || "", ref: "",
            endWhen: "", notes: "", paid: !!leg.paid, thumb: null
          });
        }
        return;
      }

      list.push({
        when: leg.departure || leg.arrival || "",
        order, icon,
        action: ACTIONS[leg.type] || "Plan",
        name, route, ref,
        endWhen: leg.departure && leg.arrival ? leg.arrival : "",
        notes: leg.notes || "",
        paid: !!leg.paid,
        thumb
      });
    });

    list.sort((a, b) => {
      if (!a.when && !b.when) return a.order - b.order;
      if (!a.when) return 1;
      if (!b.when) return -1;
      if (a.when === b.when) return a.order - b.order;
      return a.when < b.when ? -1 : 1;
    });

    return list;
  }

  function timeCell(ev) {
    const start = t(ev.when);
    if (!start) return `<div class="itn-time">—</div>`;

    let end = "";
    if (ev.endWhen) {
      const plus = dayKey(ev.endWhen) !== dayKey(ev.when) ? " +1" : "";
      end = `<span>↳ ${t(ev.endWhen)}${plus}</span>`;
    }
    return `<div class="itn-time">${start}${end}</div>`;
  }

  function rowHtml(ev, id) {
    const details = [
      ev.route ? `<div class="itn-line"><b>Route</b>${escapeHtml(ev.route)}</div>` : "",
      ev.ref ? `<div class="itn-line"><b>Booking</b>${escapeHtml(ev.ref)}</div>` : "",
      ev.endWhen ? `<div class="itn-line"><b>Arrives</b>${escapeHtml(formatDateTime(ev.endWhen))}</div>` : "",
      ev.paid ? `<div class="itn-line"><b>Status</b>Paid</div>` : "",
      ev.notes ? `<div class="itn-note">${escapeHtml(ev.notes)}</div>` : "",
      ev.thumb ? `<img class="itn-thumb light-img" src="${ev.thumb}" alt="">` : ""
    ].join("");

    const sub = ev.route || ev.ref || "";

    return `
      <div class="itn-row ${itnLevel >= 3 ? "open" : ""}" data-itn-row="${id}">
        <button type="button" class="itn-row-head">
          ${timeCell(ev)}
          <div class="itn-what">
            <b>${ev.icon} ${escapeHtml(ev.name)}</b>
            <i>${escapeHtml(ev.action)}${sub ? " · " + escapeHtml(sub) : ""}</i>
          </div>
          ${ev.paid ? `<span class="itn-dot" title="Paid"></span>` : ""}
          <span class="itn-chev">▼</span>
        </button>
        <div class="itn-row-body">
          ${details || `<div class="itn-empty">No extra details saved.</div>`}
        </div>
      </div>
    `;
  }

  function renderItinerary3() {
    const events = build();
    const dated = events.filter(e => e.when);
    const undated = events.filter(e => !e.when);

    const days = [];
    dated.forEach(ev => {
      const key = dayKey(ev.when);
      let day = days.find(d => d.key === key);
      if (!day) { day = { key, items: [] }; days.push(day); }
      day.items.push(ev);
    });

    if (undated.length) days.push({ key: "", items: undated, label: "No date yet" });

    const span = days.length && days[0].key
      ? formatDate(days[0].key) +
        (dated.length && days.filter(d => d.key).length > 1
          ? " — " + formatDate(days.filter(d => d.key).slice(-1)[0].key)
          : "")
      : "";

    let n = 0;

    app().innerHTML = `
      <main class="main itn-main">
        <button class="back-btn no-print" data-view="travel">‹ Travel &amp; Reservations</button>

        <div class="card itn-sheet">
          <div class="itn-print-head" style="display:none">
            <div class="itn-print-title">Camino Itinerary</div>
            <div class="itn-print-sub">${escapeHtml(settings.currentRoute || "Camino de Santiago")}${span ? " · " + escapeHtml(span) : ""}</div>
          </div>

          <div class="itn-head no-print">
            <h2 class="section-title">Itinerary</h2>
            <button class="btn" id="itnPrintBtn">🖨️ Print</button>
          </div>

          ${events.length === 0 ? `
            <div class="empty">
              <p>Nothing scheduled yet.</p>
              <p class="soft">Add reservations in Travel &amp; Reservations and they line up here.</p>
            </div>
          ` : `
            <div class="itn-sub no-print">${span ? escapeHtml(span) + " · " : ""}${events.length} step${events.length === 1 ? "" : "s"}</div>

            <div class="itn-levels no-print">
              <button type="button" class="itn-lvl-btn" data-lvl="1">Dates<small>just days</small></button>
              <button type="button" class="itn-lvl-btn" data-lvl="2">Times<small>+ what &amp; when</small></button>
              <button type="button" class="itn-lvl-btn" data-lvl="3">Details<small>everything</small></button>
            </div>

            ${days.map(day => `
              <section class="itn-day ${itnLevel >= 2 ? "open" : ""}">
                <button type="button" class="itn-day-head">
                  <span class="itn-day-date">${escapeHtml(day.label || formatDate(day.key))}</span>
                  <span class="itn-day-count">${day.items.length} step${day.items.length === 1 ? "" : "s"}</span>
                  <span class="itn-chev">▼</span>
                </button>
                <div class="itn-day-body">
                  ${day.items.map(ev => rowHtml(ev, n++)).join("")}
                </div>
              </section>
            `).join("")}
          `}
        </div>
      </main>
    `;

    const root = app();

    root.querySelector("[data-view='travel']").onclick = () => setView("travel");

    const printBtn = document.getElementById("itnPrintBtn");
    if (printBtn) printBtn.onclick = () => window.print();

    // level buttons: they set every section at once
    function paintLevel() {
      root.querySelectorAll(".itn-lvl-btn").forEach(b => {
        b.classList.toggle("active", Number(b.dataset.lvl) === itnLevel);
      });
      root.querySelectorAll(".itn-day").forEach(d => {
        d.classList.toggle("open", itnLevel >= 2);
      });
      root.querySelectorAll(".itn-row").forEach(r => {
        r.classList.toggle("open", itnLevel >= 3);
      });
    }

    root.querySelectorAll(".itn-lvl-btn").forEach(btn => {
      btn.onclick = () => {
        itnLevel = Number(btn.dataset.lvl);
        try { localStorage.setItem("caminoItnLevel", String(itnLevel)); } catch (e) {}
        paintLevel();
      };
    });

    // individual taps still work, for peeking at one thing
    root.querySelectorAll(".itn-day-head").forEach(head => {
      head.onclick = () => head.parentElement.classList.toggle("open");
    });

    root.querySelectorAll(".itn-row-head").forEach(head => {
      head.onclick = e => {
        if (e.target.closest("img")) return;
        head.parentElement.classList.toggle("open");
      };
    });

    paintLevel();
  }

  const prevRender = render;

  render = function () {
    if (state.view === "itinerary") {
      if (typeof closeMenu === "function") closeMenu();
      renderItinerary3();
      return;
    }
    prevRender();
  };

  if (state.view === "itinerary") render();

})();
</script>
