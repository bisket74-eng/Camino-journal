<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Camino Journal</title>

<meta name="description" content="A daily Camino journal, travel log, scrapbook, and printable book." />
<meta name="theme-color" content="#efe4cf" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Camino Journal" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Courier+Prime:wght@400;700&family=Libre+Baskerville:wght@400;700&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --sand: #efe4cf;
  --sand-dark: #dfcba8;
  --paper: #fbf5e8;
  --paper-soft: #f5ead6;
  --ink: #2d241d;
  --muted: #776650;
  --blue: #2f496e;
  --red: #993a30;
  --green: #4f684f;
  --gold: #b98b3b;
  --line: rgba(45,36,29,.18);
  --shadow: 0 12px 32px rgba(62,47,29,.14);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  color: var(--ink);
  font-family: "Libre Franklin", system-ui, sans-serif;
  font-size: 16px;
  background:
    radial-gradient(circle at 18% 4%, rgba(255,255,255,.55), transparent 32%),
    radial-gradient(circle at 85% 70%, rgba(153,58,48,.08), transparent 34%),
    linear-gradient(135deg, #eadbc0, #f7eedb 48%, #e2ceaa);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .18;
  background-image:
    linear-gradient(90deg, rgba(45,36,29,.05) 1px, transparent 1px),
    linear-gradient(rgba(45,36,29,.04) 1px, transparent 1px);
  background-size: 28px 28px;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

.airmail-border {
  height: 10px;
  width: 100%;
  background: repeating-linear-gradient(
    -45deg,
    var(--red) 0px,
    var(--red) 10px,
    var(--paper) 10px,
    var(--paper) 15px,
    var(--blue) 15px,
    var(--blue) 25px,
    var(--paper) 25px,
    var(--paper) 30px
  );
}

.app-header {
  text-align: center;
  padding: 13px 14px 12px;
  border-bottom: 1px solid rgba(45,36,29,.12);
  background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0));
}

.header-mark {
  line-height: 1;
  margin-bottom: 4px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.camino-shell-icon {
  width: 48px;
  height: 48px;
  display: block;
  border-radius: 50%;
  object-fit: cover;
  filter: drop-shadow(0 2px 2px rgba(62,47,29,.16));
}

.app-title {
  margin: 0;
  font-family: "Cinzel", "Cormorant Garamond", serif;
  font-size: clamp(36px, 10vw, 44px);
  line-height: .96;
  letter-spacing: .8px;
  color: var(--ink);
}

.app-subtitle {
  margin-top: 5px;
  color: var(--blue);
  font-family: "Courier Prime", monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2.2px;
}

.header-actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.btn {
  border: 1px solid rgba(47,73,110,.28);
  background: rgba(251,245,232,.82);
  color: var(--blue);
  border-radius: 5px;
  padding: 8px 12px;
  cursor: pointer;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  box-shadow: 0 2px 6px rgba(62,47,29,.07);
}

.btn:hover {
  background: #fffdf8;
}

.btn-red {
  background: var(--red);
  color: white;
  border-color: var(--red);
}

.btn-danger {
  color: var(--red);
  border-color: rgba(153,58,48,.45);
  background: transparent;
}

.main {
  max-width: 640px;
  margin: 0 auto;
  padding: 20px 16px 110px;
  position: relative;
}

.card {
  background: rgba(251,245,232,.94);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  border-radius: 10px;
  padding: 22px 20px;
}

.route-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
  padding: 16px 17px;
}

.route-title {
  font-family: "Cormorant Garamond", serif;
  font-size: 25px;
  font-weight: 700;
  line-height: 1.05;
}

.route-meta {
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}

.empty {
  text-align: center;
  padding: 48px 22px;
  color: var(--blue);
}

.empty-icon {
  font-size: 38px;
}

.empty p {
  margin: 12px 0 0;
  font-size: 17px;
}

.empty .soft {
  color: var(--muted);
  font-family: "Libre Baskerville", serif;
  font-style: italic;
  font-size: 14px;
}

.entry-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.entry-card {
  width: 100%;
  text-align: left;
  display: flex;
  gap: 16px;
  align-items: center;
  position: relative;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: rgba(251,245,232,.96);
  padding: 14px 14px 14px 12px;
  box-shadow: 0 8px 22px rgba(62,47,29,.1);
  cursor: pointer;
}

.entry-card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 12px;
  bottom: 12px;
  width: 3px;
  border-radius: 3px;
  background: linear-gradient(var(--red), var(--gold));
}

.entry-body {
  flex: 1;
  min-width: 0;
}

.entry-title {
  font-family: "Cormorant Garamond", serif;
  font-size: 26px;
  font-weight: 700;
  line-height: 1.05;
}

.entry-meta {
  font-family: "Courier Prime", monospace;
  color: var(--blue);
  font-size: 12px;
  margin-top: 5px;
}

.entry-snippet {
  margin-top: 9px;
  font-family: "Libre Baskerville", serif;
  font-size: 14px;
  line-height: 1.55;
  color: rgba(45,36,29,.76);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.fab {
  position: fixed;
  right: 24px;
  bottom: 24px;
  width: 58px;
  height: 58px;
  border: none;
  border-radius: 50%;
  background: var(--red);
  color: white;
  font-size: 31px;
  line-height: 1;
  box-shadow: 0 8px 20px rgba(62,47,29,.32);
  cursor: pointer;
}

@media (min-width: 700px) {
  .fab {
    right: calc(50% - 320px - 72px);
  }
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: none;
  border: none;
  padding: 7px 0 15px;
  color: var(--blue);
  cursor: pointer;
  font-weight: 700;
}

.section-title {
  margin: 0 0 8px;
  font-family: "Cormorant Garamond", serif;
  font-size: 30px;
  line-height: 1;
}

.panel-sub {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
  margin: 6px 0 20px;
}

.field {
  margin-bottom: 20px;
}

.field-label,
.detail-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: "Courier Prime", monospace;
  color: var(--blue);
  font-size: 13px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 9px;
}

.input,
.textarea,
.select {
  width: 100%;
  border: 1px solid rgba(45,36,29,.24);
  background: #fffdf8;
  border-radius: 5px;
  color: var(--ink);
  padding: 12px 13px;
  font-size: 16px;
}

.textarea {
  min-height: 150px;
  resize: vertical;
  line-height: 1.75;
  font-family: "Libre Baskerville", serif;
  background-image: repeating-linear-gradient(
    to bottom,
    transparent,
    transparent 31px,
    rgba(47,73,110,.12) 32px
  );
}

.input:focus,
.textarea:focus,
.select:focus {
  outline: 2px solid rgba(47,73,110,.35);
  outline-offset: 1px;
}

.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

@media (max-width: 500px) {
  .field-row {
    grid-template-columns: 1fr;
  }
}

.choice-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.choice {
  border: 1px solid rgba(45,36,29,.22);
  background: #fffdf8;
  color: var(--ink);
  border-radius: 4px;
  padding: 9px 11px;
  cursor: pointer;
}

.choice.selected {
  background: var(--blue);
  color: white;
  border-color: var(--blue);
}

.distance-box {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: stretch;
}

@media (max-width: 500px) {
  .distance-box {
    grid-template-columns: 1fr;
  }
}

.distance-control {
  display: flex;
  border: 1px solid rgba(45,36,29,.24);
  border-radius: 5px;
  background: #fffdf8;
  overflow: hidden;
}

.spin {
  width: 44px;
  border: none;
  background: rgba(47,73,110,.08);
  color: var(--blue);
  font-size: 24px;
  cursor: pointer;
}

.distance-input {
  flex: 1;
  min-width: 0;
  border: none;
  background: transparent;
  padding: 12px 10px;
  text-align: center;
  font-size: 24px;
  font-weight: 700;
  color: var(--ink);
}

.unit-toggle {
  display: flex;
  border: 1px solid rgba(45,36,29,.24);
  border-radius: 5px;
  background: #fffdf8;
  overflow: hidden;
}

.unit-toggle button {
  border: none;
  background: transparent;
  color: var(--muted);
  font-weight: 700;
  padding: 12px 14px;
  cursor: pointer;
}

.unit-toggle button.active {
  background: var(--blue);
  color: white;
}

.detail-title {
  margin: 12px 0 2px;
  font-family: "Cormorant Garamond", serif;
  font-size: 36px;
  line-height: 1;
}

.detail-meta {
  color: var(--blue);
  font-family: "Courier Prime", monospace;
  font-size: 13px;
  margin-bottom: 14px;
}

.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.tag {
  border-radius: 4px;
  background: rgba(47,73,110,.08);
  border: 1px solid rgba(47,73,110,.18);
  color: var(--blue);
  padding: 5px 9px;
  font-size: 13px;
  font-weight: 700;
}

.detail-section {
  margin-top: 20px;
}

.notes-display {
  white-space: pre-wrap;
  font-family: "Libre Baskerville", serif;
  font-size: 16px;
  line-height: 1.85;
  color: #372d24;
}

.photo-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.photo-tile {
  position: relative;
  aspect-ratio: 1;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.4);
}

.photo-tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo-remove {
  position: absolute;
  top: 4px;
  right: 4px;
  border: none;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  background: rgba(0,0,0,.62);
  color: white;
  cursor: pointer;
}

.photo-add {
  aspect-ratio: 1;
  border-radius: 6px;
  border: 1.5px dashed rgba(47,73,110,.36);
  background: rgba(47,73,110,.04);
  color: var(--blue);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  font-weight: 700;
}

.action-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 24px;
}

.action-row .btn {
  flex: 1;
  min-width: 120px;
}

.postmark {
  width: 80px;
  height: 80px;
  flex-shrink: 0;
}

.detail-postmark {
  width: 98px;
  height: 98px;
}

.postmark svg {
  width: 100%;
  height: 100%;
}

.pm-ring {
  fill: none;
  stroke: var(--blue);
  stroke-width: 1.8;
}

.pm-inner {
  fill: none;
  stroke: var(--blue);
  stroke-width: 1.35;
}

.pm-text {
  font-family: "Courier Prime", monospace;
  font-size: 10.6px;
  letter-spacing: .85px;
  fill: var(--blue);
  font-weight: 700;
}

.pm-day {
  font-family: "Courier Prime", monospace;
  font-size: 28px;
  fill: var(--red);
  font-weight: 700;
}

.pm-month,
.pm-year {
  font-family: "Courier Prime", monospace;
  font-size: 11px;
  letter-spacing: 1px;
  fill: var(--blue);
  font-weight: 700;
}

.stop-card {
  border: 1px solid var(--line);
  background: rgba(255,255,255,.45);
  border-radius: 7px;
  padding: 13px;
  margin-bottom: 10px;
}

.stop-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.stop-name {
  font-family: "Cormorant Garamond", serif;
  font-size: 23px;
  font-weight: 700;
}

.stop-meta {
  color: var(--muted);
  font-size: 13px;
  margin-top: 2px;
}

.stop-notes {
  font-family: "Libre Baskerville", serif;
  font-size: 14px;
  line-height: 1.6;
  margin-top: 8px;
}

.stop-photo {
  margin-top: 9px;
  width: 94px;
  height: 94px;
  object-fit: cover;
  border-radius: 5px;
  border: 1px solid var(--line);
}

.person-row {
  display: flex;
  gap: 8px;
}

.person-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.person-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(79,104,79,.1);
  border: 1px solid rgba(79,104,79,.25);
  color: var(--green);
  padding: 5px 9px;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 700;
}

.person-tag button {
  border: none;
  background: none;
  color: var(--green);
  cursor: pointer;
  padding: 0;
}

.person-photo {
  width: 25px;
  height: 25px;
  border-radius: 50%;
  object-fit: cover;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  background: var(--ink);
  color: white;
  padding: 9px 18px;
  border-radius: 22px;
  z-index: 80;
  box-shadow: 0 8px 20px rgba(0,0,0,.24);
  font-size: 13px;
}

.toast.error {
  background: var(--red);
}

.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.92);
  z-index: 100;
  display: block;
  padding: 0;
  overflow: hidden;
  touch-action: none;
  overscroll-behavior: contain;
}

.lightbox-zoom-stage {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 62px 14px 46px;
  overflow: hidden;
  touch-action: none;
  overscroll-behavior: contain;
}

.lightbox img,
.zoom-lightbox-img {
  max-width: 94vw;
  max-height: 82vh;
  border-radius: 6px;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  transform-origin: center center;
  will-change: transform;
  box-shadow: 0 10px 30px rgba(0,0,0,.36);
}

.lightbox-close {
  position: fixed;
  top: 14px;
  right: 14px;
  width: 46px;
  height: 46px;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,.94);
  color: #111;
  font-size: 30px;
  line-height: 1;
  z-index: 102;
  cursor: pointer;
}

.lightbox-reset {
  position: fixed;
  top: 14px;
  left: 14px;
  border: none;
  border-radius: 999px;
  background: rgba(255,255,255,.94);
  color: #111;
  font-weight: 700;
  padding: 11px 14px;
  z-index: 102;
  cursor: pointer;
}

.lightbox-help {
  position: fixed;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  background: rgba(255,255,255,.92);
  color: #111;
  border-radius: 999px;
  padding: 7px 12px;
  font-size: 12px;
  z-index: 102;
  white-space: nowrap;
  pointer-events: none;
}

.hidden {
  display: none !important;
}

.menu-wrap {
  position: relative;
}

.menu {
  position: absolute;
  top: calc(100% + 7px);
  left: 50%;
  transform: translateX(-50%);
  background: #fffdf8;
  border: 1px solid var(--line);
  border-radius: 7px;
  box-shadow: 0 12px 24px rgba(62,47,29,.22);
  z-index: 50;
  min-width: 200px;
  overflow: hidden;
}

.menu button {
  width: 100%;
  border: none;
  background: none;
  text-align: left;
  padding: 12px 14px;
  font-weight: 700;
  color: var(--ink);
  cursor: pointer;
}

.menu button:hover {
  background: rgba(185,139,59,.12);
}

.menu button + button {
  border-top: 1px solid rgba(45,36,29,.09);
}

.packing-group {
  border: 1px solid var(--line);
  border-radius: 7px;
  margin-bottom: 12px;
  overflow: hidden;
  background: rgba(255,255,255,.35);
}

.packing-head {
  width: 100%;
  border: none;
  background: rgba(47,73,110,.06);
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 13px 14px;
  cursor: pointer;
  font-weight: 700;
  color: var(--ink);
}

.packing-body {
  padding: 10px 14px 14px;
}

.packing-row {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid rgba(45,36,29,.07);
}

.packing-row:last-child {
  border-bottom: none;
}

.check-btn {
  width: 23px;
  height: 23px;
  border-radius: 4px;
  border: 1.5px solid rgba(45,36,29,.35);
  background: white;
  cursor: pointer;
}

.check-btn.checked {
  background: var(--green);
  border-color: var(--green);
  color: white;
}

.pack-name {
  flex: 1;
}

.pack-name.checked {
  text-decoration: line-through;
  opacity: .55;
}

.travel-card {
  width: 100%;
  text-align: left;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.42);
  border-radius: 6px;
  padding: 13px;
  margin-bottom: 10px;
  cursor: pointer;
}

.travel-title {
  font-weight: 700;
}

.travel-meta {
  color: var(--blue);
  font-size: 13px;
  margin-top: 4px;
}

.print-shell {
  max-width: 980px;
  margin: 0 auto;
  padding: 18px 12px 60px;
}

.print-toolbar {
  background: rgba(251,245,232,.96);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 16px;
}

.print-page {
  width: min(850px, 100%);
  min-height: 1100px;
  margin: 0 auto 22px;
  background: #fff7e8;
  color: #2d241b;
  box-shadow: 0 8px 25px rgba(0,0,0,.15);
  border: 1px solid rgba(45,36,29,.12);
  position: relative;
  overflow: hidden;
  padding: 54px;
  page-break-after: always;
}

.print-page::before {
  content: "";
  position: absolute;
  inset: 18px;
  border: 1px solid rgba(185,139,59,.28);
  pointer-events: none;
}

.print-kicker {
  font-family: "Courier Prime", monospace;
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--blue);
}

.print-title {
  font-family: "Cormorant Garamond", serif;
  font-size: 48px;
  line-height: .95;
  margin: 8px 0 10px;
}

.print-meta {
  font-family: "Courier Prime", monospace;
  color: var(--red);
  font-size: 13px;
  margin-bottom: 24px;
}

.print-notes {
  font-family: "Libre Baskerville", serif;
  font-size: 17px;
  line-height: 1.9;
  white-space: pre-wrap;
}

.print-photo {
  object-fit: cover;
  border: 8px solid white;
  box-shadow: 0 6px 14px rgba(45,36,29,.18);
  background: #ddd;
}

.layout-postcard .photo-area {
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  gap: 16px;
  margin: 20px 0;
}

.travel-list {

}

}

}

  display: grid;

}

}

  border-radius: 5px;

  /* =====================================================================
   PRETTY PAGES v2  —  real 8.5 × 11 scrapbook sheets with book margins
   Paste at the very end of the stylesheet, just above the closing style tag.
   Everything scales off --pw (the page width), so the on-screen preview
   and the printed sheet are the same design, just at different sizes.
   ===================================================================== */

.print-shell .print-page.pretty-sheet {
  --pw: min(94vw, 720px);
  --edge: calc(var(--pw) * .055);
  --bind: calc(var(--pw) * .100);
  --gap: calc(var(--pw) * .020);

  position: relative !important;
  display: block !important;
  width: var(--pw) !important;
  height: auto !important;
  min-height: 0 !important;
  max-height: none !important;
  aspect-ratio: 8.5 / 11 !important;
  margin: 0 auto 24px !important;
  padding: 0 !important;
  overflow: hidden !important;
  border: 1px solid rgba(45,36,29,.16) !important;
  box-shadow: 0 12px 30px rgba(62,47,29,.18) !important;
  background:
    radial-gradient(circle at 14% 8%, rgba(255,255,255,.85), transparent 34%),
    radial-gradient(circle at 88% 92%, rgba(153,58,48,.07), transparent 36%),
    repeating-linear-gradient(114deg, rgba(45,36,29,.020) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(26deg, rgba(45,36,29,.015) 0 1px, transparent 1px 9px),
    linear-gradient(168deg, #fffaf0, #f0dfc0) !important;
  -webkit-print-color-adjust: exact !important;
  print-color-adjust: exact !important;
}

.print-shell.size-8x10 .print-page.pretty-sheet { --pw: min(94vw, 680px) !important; aspect-ratio: 4 / 5 !important; }
.print-shell.size-5x7  .print-page.pretty-sheet { --pw: min(94vw, 520px) !important; aspect-ratio: 5 / 7 !important; }
.print-shell.size-phone .print-page.pretty-sheet { --pw: min(94vw, 420px) !important; aspect-ratio: 9 / 16 !important; }

/* thin decorative frame — it shifts with the binding edge */
.print-shell .print-page.pretty-sheet::before {
  content: "" !important;
  position: absolute !important;
  top: calc(var(--pw) * .030) !important;
  bottom: calc(var(--pw) * .030) !important;
  left: calc(var(--pw) * .030) !important;
  right: calc(var(--pw) * .030) !important;
  border: 1px solid rgba(185,139,59,.34) !important;
  z-index: 1;
  pointer-events: none;
}
.print-shell .print-page.sheet-recto::before { left: calc(var(--bind) - var(--pw) * .026) !important; }
.print-shell .print-page.sheet-verso::before { right: calc(var(--bind) - var(--pw) * .026) !important; }
.print-shell.bind-off .print-page.pretty-sheet::before {
  left: calc(var(--pw) * .030) !important;
  right: calc(var(--pw) * .030) !important;
}

/* on screen only: soft shading so you can see which edge binds */
@media screen {
  .print-shell .print-page.sheet-recto::after,
  .print-shell .print-page.sheet-verso::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: var(--bind);
    z-index: 0;
    pointer-events: none;
  }
  .print-shell .print-page.sheet-recto::after {
    left: 0;
    background: linear-gradient(90deg, rgba(45,36,29,.11), transparent);
  }
  .print-shell .print-page.sheet-verso::after {
    right: 0;
    background: linear-gradient(270deg, rgba(45,36,29,.11), transparent);
  }
  .print-shell.bind-off .print-page.pretty-sheet::after { display: none; }
}

/* ---------- the printable area, with the gutter margin ---------- */
.pretty-sheet .sheet-inner {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  padding: calc(var(--pw) * .062) var(--edge) calc(var(--pw) * .058) var(--edge);
}
.pretty-sheet.sheet-recto .sheet-inner { padding-left: var(--bind); }
.pretty-sheet.sheet-verso .sheet-inner { padding-right: var(--bind); }
.print-shell.bind-off .pretty-sheet .sheet-inner {
  padding-left: var(--edge) !important;
  padding-right: var(--edge) !important;
}

/* ---------- masthead ---------- */
.pretty-sheet .sheet-head {
  position: relative;
  flex: 0 0 auto;
  padding-right: calc(var(--pw) * .135);
  margin-bottom: var(--gap);
}
.pretty-sheet .page-seal {
  position: absolute;
  right: 0;
  top: calc(var(--pw) * -.010);
  width: calc(var(--pw) * .108);
  height: calc(var(--pw) * .108);
  transform: rotate(7deg);
  opacity: .92;
}
.pretty-sheet .page-seal img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  border-radius: 50%;
}
.pretty-sheet .page-route {
  font-family: "Courier Prime", monospace;
  font-size: calc(var(--pw) * .0126);
  letter-spacing: calc(var(--pw) * .0017);
  text-transform: uppercase;
  color: var(--red);
}
.pretty-sheet .page-title {
  font-family: "Cormorant Garamond", serif;
  font-weight: 700;
  font-size: calc(var(--pw) * .0410);
  line-height: .96;
  margin: calc(var(--pw) * .006) 0 calc(var(--pw) * .005);
  color: #3a2a1d;
}
.pretty-sheet .page-date {
  font-family: "Caveat", cursive;
  font-size: calc(var(--pw) * .0250);
  line-height: 1;
  color: var(--blue);
}

/* ---------- the photo / writing area fills the rest of the sheet ---------- */
.pretty-sheet .sheet-body {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  gap: var(--gap);
}
.pretty-sheet .sheet-body > *,
.pretty-sheet .sub-grid > * { min-width: 0; min-height: 0; }
.pretty-sheet .sub-grid { display: grid; gap: var(--gap); min-height: 0; }

/* ---------- snapshots ---------- */
.pretty-sheet .snap {
  position: relative;
  background: #fffdf7;
  padding: calc(var(--pw) * .0088);
  border-radius: 1px;
  box-shadow: 0 calc(var(--pw) * .0035) calc(var(--pw) * .011) rgba(62,47,29,.24);
}
.pretty-sheet .snap-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  background: #e6dac2;
}
.pretty-sheet .snap-blank {
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: none;
  border: 1px dashed rgba(185,139,59,.55);
  background:
    linear-gradient(135deg, rgba(185,139,59,.10), rgba(153,58,48,.05)),
    #fffdf7;
}
.pretty-sheet .snap-label {
  font-family: "Caveat", cursive;
  font-size: calc(var(--pw) * .0270);
  line-height: 1.1;
  text-align: center;
  color: rgba(45,36,29,.42);
  padding: 0 6%;
}
.pretty-sheet .tape {
  position: absolute;
  z-index: 3;
  top: calc(var(--pw) * -.013);
  left: 50%;
  width: calc(var(--pw) * .078);
  height: calc(var(--pw) * .026);
  transform: translateX(-50%) rotate(-3.5deg);
  background: linear-gradient(180deg, rgba(240,226,188,.88), rgba(224,203,150,.72));
  box-shadow: 0 1px 2px rgba(62,47,29,.18);
}
.pretty-sheet .tape.tape-right { left: auto; right: calc(var(--pw) * .012); transform: rotate(4deg); }
.pretty-sheet .tilt-1 { transform: rotate(-.85deg); }
.pretty-sheet .tilt-2 { transform: rotate(.70deg); }
.pretty-sheet .tilt-3 { transform: rotate(-.40deg); }
.pretty-sheet .tilt-4 { transform: rotate(1.00deg); }

/* ---------- the handwritten page ---------- */
.pretty-sheet .note-card {
  --rule: calc(var(--pw) * .0292);
  --hand: calc(var(--pw) * .0250);
  position: relative;
  overflow: hidden;
  transform: rotate(-.28deg);
  border: 1px solid rgba(185,139,59,.34);
  box-shadow: 0 calc(var(--pw) * .0035) calc(var(--pw) * .012) rgba(62,47,29,.14);
  padding: calc(var(--rule) * .5) calc(var(--pw) * .022) calc(var(--pw) * .014) calc(var(--pw) * .040);
  background-color: rgba(255,253,246,.72);
  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0,

      rgba(47,73,110,.17) calc(var(--rule) - 1px),
      rgba(47,73,110,.17) var(--rule)

.pretty-sheet .note-card.hs-medium { --rule: calc(var(--pw) * .0256); --hand: calc(var(--pw) * .0218); }

.pretty-sheet .note-card::before {

/* ---------- LAYOUT 1 · Postcard ---------- */
.sb-postcard .sheet-body {
  grid-template-columns: 1.5fr .85fr;
  grid-template-rows: 1fr 1fr 1fr 1.2fr;
}
.sb-postcard .slot-a { grid-column: 1; grid-row: 1 / 4; }
.sb-postcard .slot-b { grid-column: 2; grid-row: 1; }
.sb-postcard .slot-c { grid-column: 2; grid-row: 2; }
.sb-postcard .slot-d { grid-column: 2; grid-row: 3; }
.sb-postcard .note-card { grid-column: 1 / 3; grid-row: 4; }

/* ---------- LAYOUT 2 · Crossroads ---------- */
.sb-cross .sheet-body {
  grid-template-columns: 1fr 1.08fr 1fr;
  grid-template-rows: 1fr 1fr;
}
.sb-cross .slot-a { grid-column: 1; grid-row: 1; }
.sb-cross .slot-b { grid-column: 1; grid-row: 2; }
.sb-cross .note-card { grid-column: 2; grid-row: 1 / 3; transform: rotate(.22deg); }
.sb-cross .slot-c { grid-column: 3; grid-row: 1; }
.sb-cross .slot-d { grid-column: 3; grid-row: 2; }

/* ---------- LAYOUT 3 · Pilgrim log ---------- */
.sb-log .sheet-body { grid-template-rows: auto 1fr; }
.sb-log .log-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: calc(var(--gap) * .6);
}
.sb-log .log-cell {
  border: 1px solid rgba(45,36,29,.22);
  background: rgba(255,255,255,.42);
  padding: calc(var(--pw) * .008) calc(var(--pw) * .009);
  min-width: 0;
}
.sb-log .log-cell-label {
  font-family: "Courier Prime", monospace;
  font-size: calc(var(--pw) * .0092);
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--blue);
}
.sb-log .log-cell-value {
  font-family: "Caveat", cursive;
  font-size: calc(var(--pw) * .0225);
  line-height: 1.05;
  color: #3b2d22;
  overflow: hidden;
}
.sb-log .log-body {
  display: grid;
  grid-template-columns: .85fr 1.2fr .85fr;
  gap: var(--gap);
  min-height: 0;
}
.sb-log .photo-stack {
  display: grid;
  grid-template-rows: 1fr 1fr;
  gap: var(--gap);
  min-height: 0;
}
.sb-log .photo-stack > * { min-height: 0; }
.sb-log .log-body > *,
.sb-log .log-strip > * { min-width: 0; min-height: 0; }

/* ---------- LAYOUT 4 · Photo strip ---------- */
.sb-strip .sheet-body { grid-template-rows: 1fr 1.45fr .95fr; }
.sb-strip .strip-top { grid-template-columns: repeat(4, 1fr); }
.sb-strip .strip-bottom { grid-template-columns: 1fr 1fr; }

/* ---------- LAYOUT 5 · Diary ---------- */
.sb-diary .sheet-body {
  grid-template-columns: 1.15fr .8fr;
  grid-template-rows: 1fr 1fr .9fr;
}
.sb-diary .note-card { grid-column: 1; grid-row: 1 / 3; }
.sb-diary .slot-a { grid-column: 2; grid-row: 1; }
.sb-diary .slot-b { grid-column: 2; grid-row: 2; }
.sb-diary .strip-bottom { grid-column: 1 / 3; grid-row: 3; grid-template-columns: 1fr 1fr; }

<script>
const ROUTES = {

const SEED_ALBERGUES = {
  "Saint-Jean-Pied-de-Port": ["Albergue Compostela", "Albergue Beilari", "Albergue Municipal"],
  "Roncesvalles": ["Albergue de Roncesvalles (Colegiata)"],
  "Zubiri": ["Albergue Zaldiko", "Albergue Municipal de Zubiri"],
  "Pamplona": ["Albergue Jesús y María", "Albergue Plaza Catedral"],

  "León": ["Albergue Monasterio Las Benedictinas", "Albergue La Casa del Peregrino"],
  "Sarria": ["Albergue Internacional Sarria", "Albergue Los Blasones"],
  "Santiago de Compostela": ["Seminario Menor", "Albergue Roots & Boots"],
  "Porto": ["Pilgrims Porto Hostel", "Albergue Sé do Porto"],

};

const WEATHER_OPTIONS = [
  ["Sunny", "☀️"],
  ["Partly Cloudy", "⛅"],
  ["Overcast", "☁️"],
  ["Light Rain", "🌦️"],
  ["Heavy Rain", "🌧️"],

  ["Foggy", "🌫️"],
  ["Windy", "💨"],
  ["Hot", "🥵"],
  ["Cold", "🥶"],
  ["Snow", "❄️"]
];

const FEELING_OPTIONS = [
  "Energized", "Tired", "Sore", "Peaceful", "Joyful", "Homesick",
  "Inspired", "Overwhelmed", "Grateful", "Lonely", "Proud", "Content"
];

const STOP_TYPES = [
  "Café", "Lunch", "Store", "Church", "Viewpoint", "Rest Stop",
  "Landmark", "Albergue Visit", "Other"
];

const DEFAULT_PACKING = [
  ["Documents & Money", [
    "Passport / ID", "Pilgrim Credential (Credencial)", "Travel insurance info",
    "Photocopies of documents", "Cash & cards", "Phone + charger"
  ]],
  ["Backpack & Sleep", [
    "Backpack (30-40L)", "Backpack rain cover", "Sleeping bag liner / lightweight sleeping bag",
    "Earplugs", "Eye mask", "Packing cubes / stuff sacks"
  ]],
  ["Footwear", [
    "Broken-in hiking shoes or trail runners", "Camp shoes / sandals",
    "Hiking socks (3-4 pairs)", "Liner socks (optional)"
  ]],
  ["Clothing", [
    "Quick-dry t-shirts (2-3)", "Long-sleeve quick-dry layer",
    "Hiking pants or leggings (2 pairs)", "Underwear (3-4 pairs)",
    "Sports bra(s)", "Fleece or warm mid-layer", "Light rain jacket / poncho",
    "Hat or buff", "Sleepwear", "Swimsuit (optional)"
  ]],
  ["Toiletries & First Aid", [
    "Travel-size toiletries", "Sunscreen", "Lip balm with SPF",
    "Blister plasters (Compeed)", "Small first aid kit", "Personal medication",
    "Quick-dry towel", "Laundry soap / detergent sheets", "Clothespins or small clothesline"
  ]],
  ["Tech & Extras", [
    "Headlamp or small flashlight", "Power bank", "EU plug adapter",
    "Sunglasses", "Refillable water bottle", "Trekking poles",
    "Guidebook or app", "Small notebook & pen", "Spork / small utensil"
  ]]
];

const TRAVEL_TYPES = [
  "Airline Reservation",
  "Train Reservation",
  "Hotel Reservation",
  "Albergue Reservation",
  "Bus Reservation",
  "Taxi / Rideshare",
  "Ferry",
  "Screenshot Only",
  "Other"
];

const KEYS = {
  entries: "camino-journal-entries-v3",
  oldEntries: "camino-journal-entries-v1",
  custom: "camino-journal-custom-v3",
  packing: "camino-journal-packing-v3",
  travel: "camino-journal-travel-v3",
  settings: "camino-journal-settings-v3"
};

let state = {
  view: "journal",
  activeId: null,
  draft: null,
  stopDraft: null,
  travelDraft: null,
  printMode: null,
  printLayout: "mixed",
  printSize: "letter",
  packingOpen: {},
  travelReorderMode: false
};

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function load(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}

function save(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    toast("Storage is full — backup your journal soon.", true);
    return false;
  }
}

function makeDefaultPacking() {
  return DEFAULT_PACKING.map(group => ({
    category: group[0],
    items: group[1].map(name => ({ id: uid(), name, checked: false }))
  }));
}

let entries = load(KEYS.entries, null);
if (!entries) {
  const old = load(KEYS.oldEntries, []);
  entries = Array.isArray(old) ? old.map(migrateEntry) : [];
  save(KEYS.entries, entries);
}

let custom = load(KEYS.custom, {});
let packing = load(KEYS.packing, makeDefaultPacking());
let travel = load(KEYS.travel, []);
let settings = load(KEYS.settings, { currentRoute: "Camino Francés" });

function migrateEntry(e) {
  return {
    id: e.id || uid(),
    date: e.date || todayISO(),
    route: e.route || settings.currentRoute || "Camino Francés",
    town: e.town || "",
    albergue: e.albergue || "",
    distanceValue: e.distanceValue || (e.distanceKm === "Other" ? e.distanceCustom : e.distanceKm) || "",
    distanceUnit: e.distanceUnit || (e.distanceKm ? "km" : "mi"),
    weather: e.weather || [],
    feelings: e.feelings || [],
    stops: e.stops || [],
    people: Array.isArray(e.people) ? e.people.map(p => typeof p === "string" ? { id: uid(), name: p, photo: null } : p) : [],
    photos: e.photos || [],
    notes: e.notes || ""
  };
}

function persistEntries() {
  save(KEYS.entries, entries);
}

function persistSettings() {
  save(KEYS.settings, settings);
}

function persistCustom() {
  save(KEYS.custom, custom);
}

function persistPacking() {
  save(KEYS.packing, packing);
}

function persistTravel() {
  save(KEYS.travel, travel);
}
function persistAll() {
  persistEntries();
  persistSettings();
  persistCustom();
  persistPacking();
  persistTravel();
}
function toast(msg, isError) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast" + (isError ? " error" : "");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.className = "toast hidden", 1800);
}

function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString(undefined, {
    weekday: "short",
    month: "short",
    day: "numeric",
    year: "numeric"
  });
}

function formatDateTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
    " · " +
    d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function distanceText(entry) {
  if (!entry || !entry.distanceValue) return "";
  const num = Number(entry.distanceValue);
  const clean = isNaN(num) ? entry.distanceValue : num.toFixed(1).replace(".0", "");
  return clean + " " + (entry.distanceUnit || "mi");
}

function getTownOptions(route) {
  const base = ROUTES[route] || [];
  const extra = custom[route]?.towns || [];
  return [...base, ...extra.filter(t => !base.includes(t))];
}

function getAlbergueOptions(town) {
  const base = SEED_ALBERGUES[town] || [];
  const extra = custom.__albergues?.[town] || [];
  return [...base, ...extra.filter(a => !base.includes(a))];
}

function addCustomTown(route, town) {
  if (!route || !town) return;
  if ((ROUTES[route] || []).includes(town)) return;
  if (!custom[route]) custom[route] = { towns: [] };
  if (!custom[route].towns.includes(town)) custom[route].towns.push(town);
  persistCustom();
}

function addCustomAlbergue(town, albergue) {
  if (!town || !albergue) return;
  if ((SEED_ALBERGUES[town] || []).includes(albergue)) return;
  if (!custom.__albergues) custom.__albergues = {};
  if (!custom.__albergues[town]) custom.__albergues[town] = [];
  if (!custom.__albergues[town].includes(albergue)) custom.__albergues[town].push(albergue);
  persistCustom();
}
function previousTownForEntry(entry) {
  const earlier = entries
    .filter(e =>
      e.id !== entry.id &&
      e.route === entry.route &&
      e.date < entry.date &&
      e.town
    )
    .sort((a, b) => {
      if (a.date === b.date) return String(b.id).localeCompare(String(a.id));
      return a.date < b.date ? 1 : -1;
    });

  if (earlier[0]?.town) {
    return earlier[0].town;
  }

  const routeTowns = ROUTES[entry.route] || [];
  const currentIndex = routeTowns.indexOf(entry.town);

  if (currentIndex > 0) {
    return routeTowns[currentIndex - 1];
  }

  return "";
}

function entryJourneyTitle(entry) {
  const fromTown = previousTownForEntry(entry);
  const toTown = entry.town || "";

  if (fromTown && toTown) return fromTown + " to " + toTown;
  if (toTown) return toTown;
  return "Tonight’s Stop";
}

function naturalList(items) {
  items = (items || []).filter(Boolean);

  if (items.length === 0) return "";
  if (items.length === 1) return items[0];
  if (items.length === 2) return items[0] + " and " + items[1];

  return items.slice(0, -1).join(", ") + ", and " + items[items.length - 1];
}

function buildPrettyJournalText(entry) {
  const fromTown = previousTownForEntry(entry);
  const toTown = entry.town || "tonight’s stop";
  const distance = distanceText(entry);
  const albergue = entry.albergue || "";
  const people = (entry.people || []).map(p => p.name).filter(Boolean);
  const stops = entry.stops || [];
  const feelings = entry.feelings || [];
  const weather = entry.weather || [];
  const notes = (entry.notes || "").trim();

  const lines = [];

  lines.push("Dear Camino,");

  let opening = "Today, ";

  if (distance && fromTown && toTown) {
    opening += "I walked " + distance + " from " + fromTown + " to " + toTown + ".";
  } else if (distance && toTown) {
    opening += "I walked " + distance + " and landed in " + toTown + ".";
  } else if (fromTown && toTown) {
    opening += "I made my way from " + fromTown + " to " + toTown + ".";
  } else if (toTown) {
    opening += "I landed in " + toTown + ".";
  } else {
    opening += "I walked another day along the Way.";
  }

  lines.push(opening);

  if (albergue) {
    lines.push("Tonight I am staying at " + albergue + ".");
  }

  if (weather.length) {
    lines.push("The weather felt like " + naturalList(weather.map(w => w.toLowerCase())) + ".");
  }

  if (feelings.length) {
    lines.push("I was feeling " + naturalList(feelings.map(f => f.toLowerCase())) + " as the day unfolded.");
  }

  stops.forEach(stop => {
    let stopLine = "";

    if (stop.name && stop.type) {
      stopLine = "I stopped at " + stop.name + ", a " + stop.type.toLowerCase();
    } else if (stop.name) {
      stopLine = "I stopped at " + stop.name;
    } else if (stop.type) {
      stopLine = "I stopped at a " + stop.type.toLowerCase();
    }

    if (stop.area) {
      stopLine += " near " + stop.area;
    }

    if (stopLine) {
      lines.push(stopLine + ".");
    }

    if (stop.notes) {
      lines.push(stop.notes.trim());
    }
  });

  if (people.length) {
    lines.push("Along the way, I met " + naturalList(people) + ".");
  }

  if (notes) {
    lines.push(notes);
  }

  lines.push("Buen Camino.");

  return lines.join("\n\n");
}

function hashLayout(value) {
  let h = 0;
  String(value || "").split("").forEach(ch => {
    h = (h * 31 + ch.charCodeAt(0)) % 9973;
  });
  return h;
}

function rememberAppHistory(replace) {
  if (restoringFromHistory) return;
  if (!window.history || !history.pushState) return;

  try {
    if (replace) {
      history.replaceState(appHistoryState(), "", location.href);

  } catch (e) {}
}

  const minus = document.getElementById("distanceMinus");
  const plus = document.getElementById("distancePlus");

  minus.onpointerdown = () => startHold(-0.1);
  plus.onpointerdown = () => startHold(0.1);

  minus.onpointerup = stopHold;
  plus.onpointerup = stopHold;
  minus.onpointerleave = stopHold;
  plus.onpointerleave = stopHold;
  minus.onpointercancel = stopHold;
  plus.onpointercancel = stopHold;

  document.querySelectorAll("[data-unit]").forEach(btn => {
    btn.onclick = () => {
      d.distanceUnit = btn.dataset.unit;
      renderForm();
    };
  });

  document.querySelectorAll("[data-choice]").forEach(btn => {
    btn.onclick = () => {
      const field = btn.dataset.field;
      const value = btn.dataset.choice;
      const multi = btn.dataset.multi === "1";

      if (multi) {
        d[field] = d[field] || [];
        if (d[field].includes(value)) {
          d[field] = d[field].filter(x => x !== value);
        } else {
          d[field].push(value);
        }
      } else {
        d[field] = d[field] === value ? "" : value;
      }

      renderForm();
    };
  });

  document.getElementById("addPersonBtn").onclick = addPerson;
  document.getElementById("personInput").onkeydown = e => {
    if (e.key === "Enter") {
      e.preventDefault();
      addPerson();
    }
  };

  document.querySelectorAll("[data-remove-person]").forEach(btn => {
    btn.onclick = () => {
      d.people = d.people.filter(p => p.id !== btn.dataset.removePerson);
      renderForm();
    };
  });

  document.querySelectorAll("[data-person-photo]").forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.personPhoto;
      const fileInput = document.querySelector(`[data-person-file="${CSS.escape(id)}"]`);
      if (fileInput) fileInput.click();
    };
  });

  document.querySelectorAll("[data-person-file]").forEach(input => {
    input.onchange = e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const id = input.dataset.personFile;
      const reader = new FileReader();

      reader.onload = () => {
        d.people = d.people.map(p => p.id === id ? { ...p, photo: reader.result } : p);
        renderForm();
      };

      reader.readAsDataURL(file);
    };
  });

  document.getElementById("addPhotoBtn").onclick = () => document.getElementById("photoInput").click();
  document.getElementById("photoInput").onchange = e => handlePhotos(e.target.files);

    btn.onclick = () => {
      d.photos = d.photos.filter(p => p.id !== btn.dataset.removePhoto);
      renderForm();
    };
  });

  document.getElementById("saveEntryBtn").onclick = () => {
    saveDraftFromInputs();

    if (!d.town || !d.town.trim()) {
      alert("Choose or type tonight’s town / city before saving.");
      return;
    }

    settings.currentRoute = d.route;
    persistSettings();

    const exists = entries.some(e => e.id === d.id);
    if (exists) {
      entries = entries.map(e => e.id === d.id ? d : e);
    } else {
      entries.push(d);
    }

    persistEntries();
    state.draft = null;
    toast("Saved");
    setView("journal");
  };
}

function bumpDistance(delta) {
  const d = state.draft;
  let n = parseFloat(d.distanceValue || "0");
  if (isNaN(n)) n = 0;

  n = Math.max(0, Math.round((n + delta) * 10) / 10);
  d.distanceValue = n.toFixed(1);

  const input = document.getElementById("distanceInput");
  if (input) input.value = d.distanceValue;
}
function addPerson() {
  const input = document.getElementById("personInput");
  const name = input.value.trim();
  if (!name) return;

  if (!state.draft.people.some(p => p.name.toLowerCase() === name.toLowerCase())) {
    state.draft.people.push({ id: uid(), name, photo: null });
  }

  input.value = "";
  renderForm();
}


function resizeImageFile(file, maxSide = 1600, quality = 0.82) {
  return new Promise(resolve => {
    const reader = new FileReader();

    reader.onload = () => {
      const img = new Image();

      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");

        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        resolve(canvas.toDataURL("image/jpeg", quality));
      };

      img.onerror = () => resolve(reader.result);
      img.src = reader.result;
    };

    reader.onerror = () => resolve("");
    reader.readAsDataURL(file);
  });
}

function handlePhotos(files) {
  const arr = Array.from(files || []).slice(0, 8 - state.draft.photos.length);
  if (!arr.length) return;

  let remaining = arr.length;
  arr.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      state.draft.photos.push({ id: uid(), src: reader.result });
      remaining--;
      if (remaining === 0) renderForm();
    };
    reader.readAsDataURL(file);
  });
}

function moveTravelReservation(id, direction) {
  const index = travel.findIndex(item => item.id === id);
  if (index < 0) return;

  const nextIndex = index + direction;
  if (nextIndex < 0 || nextIndex >= travel.length) return;

  const copy = [...travel];
  const temp = copy[index];

  copy[index] = copy[nextIndex];
  copy[nextIndex] = temp;

  travel = copy;
  persistTravel();
  persistAll();
  renderTravel();
}

function toggleTravelPaid(id, paid) {
  travel = travel.map(item => item.id === id ? { ...item, paid } : item);
  persistTravel();
  persistAll();
  renderTravel();
}

function layoutFor(entriesToPrint, i, entry) {
  if (state.printLayout !== "mixed") return Number(state.printLayout);

  let layout = (hashLayout(entry.id) + i) % 5;

  if (i > 0) {
    const prev = (hashLayout(entriesToPrint[i - 1].id) + i - 1) % 5;
    if (layout === prev) layout = (layout + 1) % 5;
  }

  return layout;
}

function printablePage(entry, layout) {
  const photos = (entry.photos || []).map(p => p.src);

  const title = entryJourneyTitle(entry);
  const journalText = buildPrettyJournalText(entry);

  function noteSizeClass(text) {
    const length = (text || "").length;
    const lines = (text || "").split("\n").length;

    if (length > 900 || lines > 18) return "note-extra";
    if (length > 600 || lines > 13) return "note-long";
    if (length > 360 || lines > 8) return "note-medium";
    return "note-short";

  const header = `

          </div>

              ${photoSlot(1, "photo")}
            </div>
            ${note()}
            <div class="logbook-photo-column">
              ${photoSlot(2, "photo")}
              ${photoSlot(3, "photo")}
            </div>
          </div>
        </div>
      </section>
    `;
  }

  if (layout === 3) {
    return `
      <section class="print-page layout-four-top">
        ${header}
        <div class="pretty-body">
          <div class="top-photo-row">
            ${photoSlot(0, "first view")}

  return `

function backupData() {
  const payload = {
    app: "camino-journal",
    version: 3,
    exportedAt: new Date().toISOString(),
    entries,
    custom,
    packing,
    travel,
    settings
  };

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "camino-journal-backup-" + todayISO() + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("Backup created");
}

function restoreData(file) {
  const reader = new FileReader();

  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.entries)) throw new Error("Bad backup");

      entries = data.entries.map(migrateEntry);
      custom = data.custom || data.customRoutes || {};
      packing = Array.isArray(data.packing) ? data.packing : Array.isArray(data.packingList) ? data.packingList : packing;
      travel = Array.isArray(data.travel) ? data.travel : Array.isArray(data.travelLegs) ? data.travelLegs : travel;
      settings = data.settings || settings;

      persistEntries();
      persistCustom();
      persistPacking();
      persistTravel();
      persistSettings();

      toast("Restored " + entries.length + " entries");
      setView("journal");
    } catch (e) {
      toast("Couldn't read that backup file.", true);
    }
  };

  reader.readAsText(file);
}

  // Kept so existing render functions can call it safely.

function openZoomLightbox(src) {
  const box = document.getElementById("lightbox");
  if (!box || !src) return;

  box.innerHTML = `
    <div class="lightbox-controls">
      <div class="lightbox-control-group">
        <button type="button" class="lightbox-zoom-btn" id="lightboxZoomOutBtn">−</button>
        <button type="button" class="lightbox-zoom-btn" id="lightboxZoomInBtn">+</button>
        <button type="button" class="lightbox-reset" id="lightboxResetBtn">Reset</button>
      </div>
      <button type="button" class="lightbox-close" id="lightboxCloseBtn">×</button>
    </div>
    <div class="lightbox-zoom-stage" id="lightboxZoomStage">
      <img id="zoomLightboxImg" class="zoom-lightbox-img" src="${src}" alt="Zoomed photo">
    </div>
    <div class="lightbox-help">Use + / − or pinch · Drag when zoomed</div>
  `;

  box.className = "lightbox";
  document.documentElement.style.overflow = "hidden";
  document.body.style.overflow = "hidden";

  const stage = document.getElementById("lightboxZoomStage");
  const zoomImg = document.getElementById("zoomLightboxImg");
  const closeBtn = document.getElementById("lightboxCloseBtn");
  const resetBtn = document.getElementById("lightboxResetBtn");
  const zoomInBtn = document.getElementById("lightboxZoomInBtn");
  const zoomOutBtn = document.getElementById("lightboxZoomOutBtn");

  let scale = 1;
  let x = 0;
  let y = 0;
  let startX = 0;
  let startY = 0;
  let startScale = 1;
  let startDistance = 0;
  let lastTap = 0;
  const pointers = new Map();

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function applyZoom() {
    zoomImg.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
  }

  function resetZoom() {
    scale = 1;
    x = 0;
    y = 0;
    pointers.clear();
    applyZoom();
  }

  function bumpZoom(amount) {
    scale = clamp(scale + amount, 1, 7);
    if (scale <= 1.02) {
      resetZoom();
    } else {
      applyZoom();
    }
  }

  function closeLightbox() {
    document.documentElement.style.overflow = "";
    document.body.style.overflow = "";
    box.className = "lightbox hidden";
    box.innerHTML = "";
  }

  function pointList() {
    return Array.from(pointers.values());
  }

  function touchDistance() {
    const pts = pointList();
    if (pts.length < 2) return 0;
    const dx = pts[0].clientX - pts[1].clientX;
    const dy = pts[0].clientY - pts[1].clientY;
    return Math.hypot(dx, dy);
  }

  closeBtn.addEventListener("click", e => {
    e.preventDefault();
    e.stopPropagation();
    closeLightbox();
  });

  resetBtn.addEventListener("click", e => {
    e.preventDefault();
    e.stopPropagation();
    resetZoom();
  });

  zoomInBtn.addEventListener("click", e => {
    e.preventDefault();
    e.stopPropagation();
    bumpZoom(.6);
  });

  zoomOutBtn.addEventListener("click", e => {
    e.preventDefault();
    e.stopPropagation();
    bumpZoom(-.6);
  });

  stage.addEventListener("click", e => {
    e.preventDefault();
    e.stopPropagation();
  });

  stage.addEventListener("dblclick", e => {
    e.preventDefault();
    e.stopPropagation();
    if (scale <= 1.05) {
      scale = 2.7;
      applyZoom();
    } else {
      resetZoom();
    }
  });

  stage.addEventListener("pointerdown", e => {
    e.preventDefault();
    e.stopPropagation();

    try {
      stage.setPointerCapture(e.pointerId);
    } catch (err) {}

    pointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });

    if (pointers.size === 1) {
      startX = e.clientX - x;
      startY = e.clientY - y;

      const now = Date.now();
      if (now - lastTap < 320) {
        if (scale <= 1.05) {
          scale = 2.7;
          applyZoom();
        } else {
          resetZoom();
        }
        lastTap = 0;
      } else {
        lastTap = now;
      }
    }

    if (pointers.size === 2) {
      startDistance = touchDistance() || 1;
      startScale = scale;
    }
  }, { passive: false });

  stage.addEventListener("pointermove", e => {
    if (!pointers.has(e.pointerId)) return;

    e.preventDefault();
    e.stopPropagation();

    pointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });

    if (pointers.size >= 2) {
      const newDistance = touchDistance() || startDistance || 1;
      scale = clamp(startScale * (newDistance / startDistance), 1, 7);
      applyZoom();
      return;
    }

    if (pointers.size === 1 && scale > 1.02) {
      x = e.clientX - startX;
      y = e.clientY - startY;
      applyZoom();
    }
  }, { passive: false });

  function endPointer(e) {
    if (pointers.has(e.pointerId)) {
      e.preventDefault();
      e.stopPropagation();
    }

    pointers.delete(e.pointerId);

    if (scale <= 1.02) resetZoom();

    const pts = pointList();
    if (pts.length === 1) {
      startX = pts[0].clientX - x;
      startY = pts[0].clientY - y;
    }
    if (pts.length >= 2) {
      startDistance = touchDistance() || 1;
      startScale = scale;
    }
  }

  stage.addEventListener("pointerup", endPointer, { passive: false });
  stage.addEventListener("pointercancel", endPointer, { passive: false });
  stage.addEventListener("lostpointercapture", e => pointers.delete(e.pointerId));

  stage.addEventListener("touchstart", e => {
    e.preventDefault();
    e.stopPropagation();
  }, { passive: false });

  stage.addEventListener("touchmove", e => {
    e.preventDefault();
    e.stopPropagation();
  }, { passive: false });

  stage.addEventListener("wheel", e => {
    e.preventDefault();
    e.stopPropagation();
    bumpZoom(e.deltaY < 0 ? .25 : -.25);
  }, { passive: false });
}

const ITIN_ICONS = {
  "Airline Reservation": "✈️",
  "Train Reservation": "🚆",
  "Hotel Reservation": "🏨",
  "Albergue Reservation": "🛏️",
  "Bus Reservation": "🚌",
  "Taxi / Rideshare": "🚕",
  "Ferry": "⛴️",
  "Screenshot Only": "📷",
  "Other": "📌"
};

const ITIN_ACTIONS = {
  "Airline Reservation": "Fly",
  "Train Reservation": "Train",
  "Bus Reservation": "Bus",
  "Taxi / Rideshare": "Ride",
  "Ferry": "Ferry",
  "Screenshot Only": "Plan",
  "Other": "Plan"
};

const ITIN_STAYS = ["Hotel Reservation", "Albergue Reservation"];

function itinTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function buildItinerary() {
  const events = [];

  travel.forEach((t, order) => {
    const icon = ITIN_ICONS[t.type] || "📌";
    const name = t.title || t.carrier || t.type || "Reservation";
    const route = t.from && t.to ? t.from + " → " + t.to : (t.from || t.to || "");
    const ref = [t.carrier, t.number].filter(Boolean).join(" · ");
    const thumb = (t.photos || [])[0] ? t.photos[0].src : null;

    if (ITIN_STAYS.includes(t.type)) {
      events.push({
        when: t.departure || "",
        order, icon,
        action: "Check in",
        name,
        lines: [route, ref].filter(Boolean),
        notes: t.notes || "",
        paid: !!t.paid,
        thumb
      });

      if (t.arrival) {
        events.push({
          when: t.arrival,
          order, icon: "🧳",
          action: "Check out",
          name,
          lines: [t.from].filter(Boolean),
          notes: "",
          paid: !!t.paid,
          thumb: null
        });
      }
      return;
    }

    events.push({
      when: t.departure || t.arrival || "",
      order, icon,
      action: ITIN_ACTIONS[t.type] || "Plan",
      name,
      lines: [
        route,
        ref,
        t.departure && t.arrival ? "Arrives " + formatDateTime(t.arrival) : ""
      ].filter(Boolean),
      notes: t.notes || "",
      paid: !!t.paid,
      thumb
    });
  });

  events.sort((a, b) => {
    if (!a.when && !b.when) return a.order - b.order;
    if (!a.when) return 1;
    if (!b.when) return -1;
    if (a.when === b.when) return a.order - b.order;
    return a.when < b.when ? -1 : 1;
  });

  return events;
}

function itinItemHtml(ev) {
  return `
    <div class="itin-item">
      <div class="itin-time">${escapeHtml(itinTime(ev.when) || "—")}</div>
      <div class="itin-card">
        <div class="itin-head">
          <span>${ev.icon}</span>
          <span class="itin-action">${escapeHtml(ev.action)}</span>
          ${ev.paid ? `<span class="itin-paid">Paid</span>` : ""}
          <span class="itin-name">${escapeHtml(ev.name)}</span>
        </div>
        ${ev.lines.map(l => `<div class="itin-line">${escapeHtml(l)}</div>`).join("")}
        ${ev.notes ? `<div class="itin-note">${escapeHtml(ev.notes)}</div>` : ""}
        ${ev.thumb ? `<img class="itin-thumb light-img" src="${ev.thumb}" alt="">` : ""}
      </div>
    </div>
  `;
}

function renderItinerary() {
  const events = buildItinerary();
  const dated = events.filter(e => e.when);
  const undated = events.filter(e => !e.when);

  const days = [];
  dated.forEach(ev => {
    const key = String(ev.when).slice(0, 10);
    let day = days.find(d => d.key === key);
    if (!day) {
      day = { key, items: [] };
      days.push(day);
    }
    day.items.push(ev);
  });

  const span = days.length
    ? formatDate(days[0].key) + (days.length > 1 ? " — " + formatDate(days[days.length - 1].key) : "")
    : "";

  app().innerHTML = `
    <main class="main">
      <button class="back-btn no-print" data-view="travel">‹ Travel & Reservations</button>

      <div class="card">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;">
          <h2 class="section-title">Itinerary</h2>
          <button class="btn no-print" id="printItinBtn">🖨️ Print / Save PDF</button>
        </div>

        ${
          events.length === 0
            ? `<div class="empty">
                <p>Nothing scheduled yet.</p>
                <p class="soft">Add reservations in Travel & Reservations and they'll line up here by date and time.</p>
              </div>`
            : `
              ${span ? `<div class="itin-summary">${escapeHtml(span)} · ${events.length} step${events.length === 1 ? "" : "s"}</div>` : ""}

              ${days.map(day => `
                <div class="itin-day">
                  <div class="itin-day-head"><span>${escapeHtml(formatDate(day.key))}</span></div>
                  ${day.items.map(itinItemHtml).join("")}
                </div>
              `).join("")}

              ${
                undated.length
                  ? `<div class="itin-day itin-undated">
                      <div class="itin-day-head"><span>No date yet</span></div>
                      ${undated.map(itinItemHtml).join("")}
                    </div>`
                  : ""
              }
            `
        }
      </div>
    </main>
  `;

  document.querySelector("[data-view='travel']").onclick = () => setView("travel");
  const printItin = document.getElementById("printItinBtn");
  if (printItin) printItin.onclick = () => window.print();
}

<script>
/* =====================================================================
   CAMINO JOURNAL — Currency Converter + Bigger Trip Tools + Clean Itinerary
   ===================================================================== */

(function caminoExtrasV3() {
if (window.__caminoExtrasV3) return;
window.__caminoExtrasV3 = true;

/* ---------------------------------------------------------------
   1. CURRENCY CONVERTER
   --------------------------------------------------------------- */

const FX_KEY = "camino-journal-fx-v1";

const CURRENCIES = [
  ["EUR", "Euro"],
  ["USD", "US Dollar"],
  ["INR", "Indian Rupee"],
  ["GBP", "British Pound"],
  ["JPY", "Japanese Yen"],
  ["CHF", "Swiss Franc"],
  ["CAD", "Canadian Dollar"],
  ["AUD", "Australian Dollar"],
  ["NZD", "New Zealand Dollar"],
  ["CNY", "Chinese Yuan"],
  ["HKD", "Hong Kong Dollar"],
  ["SGD", "Singapore Dollar"],

  ["TWD", "Taiwan Dollar"],
  ["THB", "Thai Baht"],

  ["IDR", "Indonesian Rupiah"],
  ["PHP", "Philippine Peso"],
  ["VND", "Vietnamese Dong"],
  ["AED", "UAE Dirham"],
  ["SAR", "Saudi Riyal"],
  ["QAR", "Qatari Riyal"],
  ["ILS", "Israeli Shekel"],
  ["TRY", "Turkish Lira"],
  ["EGP", "Egyptian Pound"],
  ["MAD", "Moroccan Dirham"],
  ["ZAR", "South African Rand"],
  ["NGN", "Nigerian Naira"],
  ["KES", "Kenyan Shilling"],
  ["PKR", "Pakistani Rupee"],
  ["BDT", "Bangladeshi Taka"],
  ["LKR", "Sri Lankan Rupee"],
  ["NPR", "Nepalese Rupee"],
  ["SEK", "Swedish Krona"],
  ["NOK", "Norwegian Krone"],
  ["DKK", "Danish Krone"],
  ["PLN", "Polish Zloty"],
  ["CZK", "Czech Koruna"],
  ["HUF", "Hungarian Forint"],
  ["RON", "Romanian Leu"],
  ["BGN", "Bulgarian Lev"],
  ["ISK", "Icelandic Krona"],
  ["UAH", "Ukrainian Hryvnia"],
  ["MXN", "Mexican Peso"],
  ["BRL", "Brazilian Real"],
  ["ARS", "Argentine Peso"],
  ["CLP", "Chilean Peso"],
  ["COP", "Colombian Peso"],
  ["PEN", "Peruvian Sol"]
];

/* Starting rates, per 1 euro. These work with no signal at all.
   Tap Update rates when you have wifi to replace them with live ones. */
const OFFLINE_RATES = {
  EUR: 1, USD: 1.14, INR: 99, GBP: 0.85, JPY: 172, CHF: 0.93,
  CAD: 1.56, AUD: 1.73, NZD: 1.90, CNY: 8.20, HKD: 8.90, SGD: 1.46,
  KRW: 1560, TWD: 34.0, THB: 37.0, MYR: 4.80, IDR: 18500, PHP: 65.0,
  VND: 29500, AED: 4.19, SAR: 4.28, QAR: 4.15, ILS: 3.90, TRY: 46.0,
  EGP: 55.0, MAD: 10.40, ZAR: 20.50, NGN: 1750, KES: 147, PKR: 320,
  BDT: 139, LKR: 340, NPR: 158, SEK: 11.00, NOK: 11.60, DKK: 7.46,
  PLN: 4.25, CZK: 24.50, HUF: 395, RON: 5.08, BGN: 1.9558, ISK: 143,
  UAH: 47.0, MXN: 21.00, BRL: 6.30, ARS: 1400, CLP: 1080, COP: 4600,
  PEN: 4.10
};

const PINNED = ["EUR", "USD", "INR", "GBP"];

let fx = load(FX_KEY, null);

if (!fx || typeof fx !== "object") fx = {};
fx.rates = Object.assign({}, OFFLINE_RATES, fx.rates || {});
fx.rates.EUR = 1;
fx.from = fx.from || "USD";
fx.to = fx.to || "EUR";
fx.amount = fx.amount || "20";
fx.updated = fx.updated || null;

function saveFx() {
  save(FX_KEY, fx);
}

function currencyName(code) {
  const found = CURRENCIES.find(c => c[0] === code);
  return found ? found[1] : code;
}

function convert(amount, from, to) {
  const a = parseFloat(amount);
  const rf = fx.rates[from];
  const rt = fx.rates[to];
  if (isNaN(a) || !rf || !rt) return null;
  return a * (rt / rf);
}

function fmtMoney(value, code) {
  if (value === null || isNaN(value)) return "—";
  try {
    return new Intl.NumberFormat(undefined, {
      style: "currency",
      currency: code,
      currencyDisplay: "narrowSymbol"
    }).format(value);
  } catch (e) {
    try {
      return new Intl.NumberFormat(undefined, {
        style: "currency",
        currency: code
      }).format(value);
    } catch (err) {
      return value.toFixed(2) + " " + code;
    }
  }
}

function fmtRate(value) {
  if (value === null || isNaN(value)) return "—";
  if (value >= 1000) return value.toFixed(0);
  if (value >= 100) return value.toFixed(1);
  if (value >= 1) return value.toFixed(3).replace(/0+$/, "").replace(/\.$/, "");
  return value.toFixed(5).replace(/0+$/, "").replace(/\.$/, "");
}

function currencyOptions(selected) {
  const opt = c =>
    `<option value="${c[0]}" ${c[0] === selected ? "selected" : ""}>${escapeHtml(c[0] + " — " + c[1])}</option>`;

  const top = PINNED
    .map(code => CURRENCIES.find(c => c[0] === code))
    .filter(Boolean);

  const rest = CURRENCIES
    .filter(c => !PINNED.includes(c[0]))
    .sort((a, b) => a[1].localeCompare(b[1]));

  return `
    <optgroup label="Most used">${top.map(opt).join("")}</optgroup>
    <optgroup label="All currencies">${rest.map(opt).join("")}</optgroup>
  `;
}

function updateCurrencyResult() {
  const amountEl = document.getElementById("fxAmount");
  const fromEl = document.getElementById("fxFrom");
  const toEl = document.getElementById("fxTo");
  if (!amountEl || !fromEl || !toEl) return;

  fx.amount = amountEl.value;
  fx.from = fromEl.value;
  fx.to = toEl.value;

  const result = convert(fx.amount || "0", fx.from, fx.to);
  const one = convert(1, fx.from, fx.to);
  const back = convert(1, fx.to, fx.from);

  const resultEl = document.getElementById("fxResult");
  const fromLineEl = document.getElementById("fxFromLine");
  const rateEl = document.getElementById("fxRateLine");
  const chipsEl = document.getElementById("fxChips");

  if (resultEl) resultEl.textContent = fmtMoney(result, fx.to);
  if (fromLineEl) {
    fromLineEl.textContent =
      fmtMoney(parseFloat(fx.amount || "0") || 0, fx.from) + " in " + currencyName(fx.to);
  }
  if (rateEl) {
    rateEl.textContent =
      "1 " + fx.from + " = " + fmtRate(one) + " " + fx.to +
      "  ·  1 " + fx.to + " = " + fmtRate(back) + " " + fx.from;
  }

  if (chipsEl) {
    chipsEl.innerHTML = [1, 5, 10, 20, 50, 100].map(n => `
      <div class="fx-chip">
        <span class="fx-chip-from">${escapeHtml(fmtMoney(n, fx.from))}</span>
        <span class="fx-chip-to">${escapeHtml(fmtMoney(convert(n, fx.from, fx.to), fx.to))}</span>
      </div>
    `).join("");
  }

  saveFx();
}

function ratesUpdatedText() {
  if (!fx.updated) return "Using built-in starting rates — tap Update rates when you have wifi.";
  const d = new Date(fx.updated);
  if (isNaN(d.getTime())) return "Rates updated.";
  return "Rates updated " + d.toLocaleDateString(undefined, {
    month: "short", day: "numeric", year: "numeric"
  }) + ".";
}

async function fetchRates() {
  const merge = incoming => {
    let count = 0;
    Object.keys(incoming || {}).forEach(code => {
      const value = Number(incoming[code]);
      if (fx.rates[code] !== undefined && value > 0) {
        fx.rates[code] = value;
        count++;
      }
    });
    fx.rates.EUR = 1;
    return count;
  };

  try {
    const res = await fetch("https://api.frankfurter.app/latest?from=EUR");
    if (res.ok) {
      const data = await res.json();
      if (data && data.rates && merge(data.rates) > 5) {
        fx.updated = new Date().toISOString();
        saveFx();
        return true;
      }
    }
  } catch (e) {}

  try {
    const res2 = await fetch("https://open.er-api.com/v6/latest/EUR");
    if (res2.ok) {
      const data2 = await res2.json();
      if (data2 && data2.rates && merge(data2.rates) > 5) {
        fx.updated = new Date().toISOString();
        saveFx();
        return true;
      }
    }
  } catch (e) {}

  return false;
}

function renderCurrency() {
  app().innerHTML = `
    <main class="main">
      <button class="back-btn" data-view="travel">‹ Travel &amp; Reservations</button>

      <div class="card fx-card">
        <h2 class="section-title">Currency Converter</h2>
        <p class="panel-sub">Works with no signal. Tap Update rates whenever you find wifi.</p>

        <div class="field">
          <label class="field-label" for="fxAmount">Amount</label>
          <input class="input fx-amount" id="fxAmount" type="number" inputmode="decimal"
                 min="0" step="0.01" value="${escapeHtml(fx.amount)}">
        </div>

        <div class="fx-pair">
          <div class="field fx-pair-field">
            <label class="field-label" for="fxFrom">From</label>
            <select class="select fx-select" id="fxFrom">${currencyOptions(fx.from)}</select>
          </div>

          <button type="button" class="fx-swap" id="fxSwapBtn" title="Swap currencies">⇅</button>

          <div class="field fx-pair-field">

            <select class="select fx-select" id="fxTo">${currencyOptions(fx.to)}</select>
          </div>
        </div>

        <div class="fx-result-card">
          <div class="fx-result-label" id="fxFromLine"></div>
          <div class="fx-result" id="fxResult"></div>

        <div class="detail-label" style="margin-top:22px;">Quick amounts</div>

        <div class="fx-footer">

          <span class="fx-updated" id="fxUpdated">${escapeHtml(ratesUpdatedText())}</span>
        </div>
      </div>
    </main>
  `;

  document.querySelector("[data-view='travel']").onclick = () => setView("travel");

  const amountEl = document.getElementById("fxAmount");
  const fromEl = document.getElementById("fxFrom");
  const toEl = document.getElementById("fxTo");

  amountEl.oninput = updateCurrencyResult;
  amountEl.onfocus = () => amountEl.select();
  fromEl.onchange = updateCurrencyResult;
  toEl.onchange = updateCurrencyResult;

  document.getElementById("fxSwapBtn").onclick = () => {
    const a = fromEl.value;
    fromEl.value = toEl.value;
    toEl.value = a;
    updateCurrencyResult();
  };

  document.getElementById("fxRefreshBtn").onclick = async () => {
    const btn = document.getElementById("fxRefreshBtn");
    const label = document.getElementById("fxUpdated");
    btn.disabled = true;
    btn.textContent = "Updating…";

    const ok = await fetchRates();

    btn.disabled = false;
    btn.textContent = "↻ Update rates";

    if (ok) {
      if (label) label.textContent = ratesUpdatedText();
      updateCurrencyResult();
      toast("Rates updated");
    } else {
      toast("No connection — keeping saved rates.", true);
    }
  };

  updateCurrencyResult();
}

/* ---------------------------------------------------------------
   2. ITINERARY — cleaner on screen, clean page breaks in print
   --------------------------------------------------------------- */

const ITIN2_ICONS = {
  "Airline Reservation": "✈️",
  "Train Reservation": "🚆",
  "Hotel Reservation": "🏨",
  "Albergue Reservation": "🛏️",
  "Bus Reservation": "🚌",
  "Taxi / Rideshare": "🚕",
  "Ferry": "⛴️",
  "Screenshot Only": "📷",
  "Other": "📌"
};

const ITIN2_ACTIONS = {
  "Airline Reservation": "Fly",
  "Train Reservation": "Train",
  "Bus Reservation": "Bus",
  "Taxi / Rideshare": "Ride",
  "Ferry": "Ferry",
  "Screenshot Only": "Plan",
  "Other": "Plan"
};

const ITIN2_STAYS = ["Hotel Reservation", "Albergue Reservation"];

function itin2Time(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function buildItin2() {
  const events = [];

  travel.forEach((t, order) => {
    const icon = ITIN2_ICONS[t.type] || "📌";
    const name = t.title || t.carrier || t.type || "Reservation";
    const route = t.from && t.to ? t.from + " → " + t.to : (t.from || t.to || "");
    const ref = [t.carrier, t.number].filter(Boolean).join(" · ");
    const thumb = (t.photos || [])[0] ? t.photos[0].src : null;

    if (ITIN2_STAYS.includes(t.type)) {
      events.push({
        when: t.departure || "",
        order,
        icon,
        action: "Check in",
        name,
        lines: [route, ref].filter(Boolean),
        notes: t.notes || "",
        paid: !!t.paid,
        thumb
      });

      if (t.arrival) {
        events.push({
          when: t.arrival,
          order,
          icon: "🧳",
          action: "Check out",
          name,
          lines: [t.from].filter(Boolean),
          notes: "",
          paid: !!t.paid,
          thumb: null
        });
      }
      return;
    }

    events.push({
      when: t.departure || t.arrival || "",
      order,
      icon,
      action: ITIN2_ACTIONS[t.type] || "Plan",
      name,
      lines: [
        route,
        ref,
        t.departure && t.arrival ? "Arrives " + formatDateTime(t.arrival) : ""
      ].filter(Boolean),
      notes: t.notes || "",
      paid: !!t.paid,
      thumb
    });
  });

  events.sort((a, b) => {
    if (!a.when && !b.when) return a.order - b.order;
    if (!a.when) return 1;
    if (!b.when) return -1;
    if (a.when === b.when) return a.order - b.order;
    return a.when < b.when ? -1 : 1;
  });

  return events;
}

function itin2ItemHtml(ev) {
  return `
    <div class="itin2-item">
      <div class="itin2-time">${escapeHtml(itin2Time(ev.when) || "—")}</div>
      <div class="itin2-card">
        <div class="itin2-kicker">
          <span class="itin2-icon">${ev.icon}</span>
          <span class="itin2-action">${escapeHtml(ev.action)}</span>
          ${ev.paid ? `<span class="itin2-paid">Paid</span>` : ""}
        </div>
        <div class="itin2-name">${escapeHtml(ev.name)}</div>
        ${ev.lines.map(l => `<div class="itin2-line">${escapeHtml(l)}</div>`).join("")}
        ${ev.notes ? `<div class="itin2-note">${escapeHtml(ev.notes)}</div>` : ""}
        ${ev.thumb ? `<img class="itin2-thumb light-img" src="${ev.thumb}" alt="">` : ""}
      </div>
    </div>
  `;
}

function renderItinerary2() {
  const events = buildItin2();
  const dated = events.filter(e => e.when);
  const undated = events.filter(e => !e.when);

  const days = [];
  dated.forEach(ev => {
    const key = String(ev.when).slice(0, 10);
    let day = days.find(d => d.key === key);
    if (!day) {
      day = { key, items: [] };
      days.push(day);
    }
    day.items.push(ev);
  });

  const span = days.length
    ? formatDate(days[0].key) + (days.length > 1 ? " — " + formatDate(days[days.length - 1].key) : "")
    : "";

  app().innerHTML = `
    <main class="main itin2-main">
      <button class="back-btn no-print" data-view="travel">‹ Travel &amp; Reservations</button>

      <div class="card itin2-sheet">
        <div class="itin2-print-head">
          <div class="itin2-print-title">Camino Itinerary</div>
          <div class="itin2-print-sub">${escapeHtml(settings.currentRoute || "Camino de Santiago")}${span ? " · " + escapeHtml(span) : ""}</div>
        </div>

        <div class="itin2-screen-head no-print">
          <h2 class="section-title">Itinerary</h2>
          <button class="btn" id="printItin2Btn">🖨️ Print / Save PDF</button>
        </div>

        ${
          events.length === 0
            ? `<div class="empty">
                <p>Nothing scheduled yet.</p>
                <p class="soft">Add reservations in Travel &amp; Reservations and they line up here by date and time.</p>
              </div>`
            : `
              ${span ? `<div class="itin2-summary no-print">${escapeHtml(span)} · ${events.length} step${events.length === 1 ? "" : "s"}</div>` : ""}

              ${days.map(day => `
                <section class="itin2-day">
                  <div class="itin2-day-head">
                    <span class="itin2-day-date">${escapeHtml(formatDate(day.key))}</span>
                    <span class="itin2-day-count">${day.items.length} step${day.items.length === 1 ? "" : "s"}</span>
                  </div>
                  ${day.items.map(itin2ItemHtml).join("")}
                </section>
              `).join("")}

              ${
                undated.length
                  ? `<section class="itin2-day">
                      <div class="itin2-day-head">
                        <span class="itin2-day-date">No date yet</span>
                        <span class="itin2-day-count">${undated.length} step${undated.length === 1 ? "" : "s"}</span>
                      </div>
                      ${undated.map(itin2ItemHtml).join("")}
                    </section>`
                  : ""
              }
            `
        }
      </div>
    </main>
  `;

  document.querySelector("[data-view='travel']").onclick = () => setView("travel");

  const printBtn = document.getElementById("printItin2Btn");
  if (printBtn) printBtn.onclick = () => window.print();
}

   3. Wire the new screens in

render = function () {
  if (state.view === "itinerary") {
    closeMenu();
    renderItinerary2();
    return;
  }

  if (state.view === "currency") {
    closeMenu();
    renderCurrency();
    return;
  }

  __caminoRenderV3();
};

const __caminoRenderTravelV3 = renderTravel;

renderTravel = function () {
  __caminoRenderTravelV3();

  const addBtn = document.getElementById("addTravelBtn");
  if (!addBtn || document.getElementById("openCurrencyBtn")) return;

  const curBtn = document.createElement("button");
  curBtn.className = "btn";
  curBtn.id = "openCurrencyBtn";
  curBtn.textContent = "💱 Currency";
  curBtn.onclick = () => setView("currency");

  addBtn.parentNode.insertBefore(curBtn, addBtn);
};

(function addCurrencyMenuItem() {
  const menu = document.getElementById("tripMenu");
  if (!menu || document.getElementById("currencyMenuBtn")) return;

  const btn = document.createElement("button");
  btn.id = "currencyMenuBtn";
  btn.textContent = "💱 Currency Converter";
  btn.onclick = () => setView("currency");

  const itinBtn = document.getElementById("itineraryMenuBtn");
  if (itinBtn && itinBtn.nextSibling) {
    menu.insertBefore(btn, itinBtn.nextSibling);
  } else if (itinBtn) {
    menu.appendChild(btn);
  } else {
    const travelBtn = menu.querySelector("[data-view='travel']");
    if (travelBtn && travelBtn.nextSibling) {
      menu.insertBefore(btn, travelBtn.nextSibling);
    } else {
      menu.appendChild(btn);
    }
  }
})();

render();

})();
</script>

<style>

@media (max-width: 380px) {

/* ---------- print: everything open, nothing split ---------- */

  body::before { display: none !important; }

  .itn-levels { display: none !important; }

  .main.itn-main {

  .itn-main .card.itn-sheet {

  .itn-day-head {

  .itn-day-date { font-size: 14pt !important; }

  .itn-row {

    background: none !important;

  }

  .itn-row-head {

  }

  .itn-time { font-size: 9pt !important; width: .62in !important; color: #993a30 !important; }

  .itn-what b { font-size: 11pt !important; white-space: normal !important; }
  .itn-what i { font-size: 8.5pt !important; white-space: normal !important; }

  .itn-row-body { padding: .06in .08in .07in !important; }
